<script>
/* ===== ZCode Toolkit — renderer patch (app.asar) =====
 * 等界面挂载好后，把速率信息以内联形式放到输入框工具栏“发送圆钮”左侧；每 800ms 从主进程的 127.0.0.1:9335 拉真实指标。
 * 整体包在 try-catch 里，任何异常静默吞掉，绝不弹错误框。
 */
(function () {
  try {

  var BAR_ID = 'zcode-tokbar';
  const MONO = 'ui-monospace,SFMono-Regular,Consolas,monospace';
  var API = 'http://127.0.0.1:9335/metrics';
  var installed = false;
  var readyAt = 0;
  var shotRequest = null;  // {hide: bool} — 截图按钮设置，下次 /metrics 轮询时带上

  function isDark() {
    var el = document.getElementById('root') || document.body;
    for (var i = 0; i < 6 && el; i++) {
      var bg = getComputedStyle(el).backgroundColor || '';
      var m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
      if (m && (m[4] === undefined || parseFloat(m[4]) > 0.5)) {
        var l = 0.299 * (+m[1]) + 0.587 * (+m[2]) + 0.114 * (+m[3]);
        return l < 128;
      }
      el = el.parentElement;
    }
    try { return matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { return true; }
  }

  function palette() {
    return isDark()
      ? { bg: '#000', fg: 'rgba(235,238,242,.62)', line: 'rgba(255,255,255,.10)', strong: '#eceff2', dim: 'rgba(255,255,255,.38)', good: '#3ddc97', warn: '#f7b955', bad: '#ff6b6b' }
      : { bg: '#fff', fg: 'rgba(17,24,39,.62)', line: 'rgba(0,0,0,.10)', strong: '#111827', dim: 'rgba(0,0,0,.38)', good: '#059669', warn: '#d97706', bad: '#dc2626' };
  }

  // 取真实底色：向上找第一个不透明的背景色，让条子和 ZCode 融合
  function bgOf(el) {
    for (var i = 0; i < 14 && el; i++) {
      var bg = getComputedStyle(el).backgroundColor || '';
      if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') return bg;
      el = el.parentElement;
    }
    return null;
  }

  function findComposer() {
    var nodes = document.querySelectorAll('textarea, [contenteditable="true"], [contenteditable=""]');
    var best = null, bestY = -Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var r = nodes[i].getBoundingClientRect();
      if (r.width < 60 || r.height < 8) continue;
      if (r.top > bestY) { bestY = r.top; best = nodes[i]; }
    }
    return best;
  }

  function findScroller() {
    var all = document.querySelectorAll('div');
    var best = null, bestH = 0;
    for (var i = 0; i < all.length; i++) {
      var cs = getComputedStyle(all[i]);
      if (!/(auto|scroll)/.test(cs.overflowY)) continue;
      if (all[i].clientHeight < 300) continue;
      if (all[i].scrollHeight <= all[i].clientHeight + 40) continue;
      if (all[i].clientHeight > bestH) { bestH = all[i].clientHeight; best = all[i]; }
    }
    return best;
  }

  function buildBar() {
    var p = palette();
    var bar = document.createElement('div');
    bar.id = BAR_ID;
    // flex:0 1 auto + min-width:0：条子可收缩；margin-left:auto 让它贴着右侧（模型选择器/发送钮）
    bar.style.cssText = [
      'display:inline-flex', 'align-items:center', 'gap:8px',
      'height:28px', 'padding:0 8px', 'box-sizing:border-box',
      'flex:0 1 auto', 'min-width:0', 'margin-left:auto', 'overflow:hidden',
      'font:11px/28px "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",ui-sans-serif,system-ui,sans-serif',
      'color:' + p.fg, 'background:transparent',
      'white-space:nowrap',
      'pointer-events:none', 'user-select:none'
    ].join(';');
    bar.innerHTML =
      '<span id="tokbar-dot" style="width:6px;height:6px;border-radius:50%;background:' + p.dim + ';flex:0 0 auto"></span>' +
      '<span id="tokbar-tps" style="color:' + p.strong + ';font-weight:600;font-size:12px;font-family:' + MONO + ';flex:0 0 auto">0.0</span>' +
      '<span id="tokbar-unit" style="color:' + p.dim + ';letter-spacing:.3px;flex:0 0 auto">tok/s</span>' +
      '<span style="flex:0 0 auto">' +
        '<span style="color:' + p.dim + ';letter-spacing:.5px;font-weight:500">缓存命中</span>' +
        '<span id="tokbar-cache" style="color:' + p.strong + ';font-family:' + MONO + ';margin-left:8px">—</span>' +
      '</span>' +
      '<span id="tokbar-tok" style="color:' + p.dim + ';flex:0 0 auto"></span>';
    return bar;
  }

  // 两档布局：工具栏行够宽 → 全显示；变窄 → 只留「速率 + 命中率」，次数/输出量整段隐藏
  var COMPACT_AT = 700; // px，输入框工具栏行的宽度阈值
  function layoutBar(bar) {
    if (!bar) return;
    var rowW = bar.parentElement ? bar.parentElement.clientWidth : window.innerWidth;
    var tok = document.getElementById('tokbar-tok');
    if (tok) tok.style.display = (rowW < COMPACT_AT) ? 'none' : '';
  }

  // 在输入框工具栏“完全访问”旁边插入截图按钮
  // 注意：React 重渲染可能克隆节点，addEventListener 会丢；这里每帧都重绑 onclick（幂等）
  function ensureShotButton() {
    var host = null, group = null;
    var divs = document.querySelectorAll('div');
    for (var i = 0; i < divs.length; i++) {
      var t = (divs[i].textContent || '').trim();
      if (t === '完全访问' || t === '安全访问') {
        var g = divs[i];
        while (g && g.parentElement && !/shrink-0/.test(String(g.className || ''))) g = g.parentElement;
        if (g && g.parentElement) { group = g; host = g.parentElement; break; }
      }
    }
    if (!host) return;

    var btn = document.getElementById('zcode-tokbar-shot');
    if (btn && btn.dataset.tokbar !== '1') { btn.remove(); btn = null; }  // 清掉旧版本残留的监听器
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'zcode-tokbar-shot';
      btn.dataset.tokbar = '1';
      btn.type = 'button';
      btn.title = '截图（框选后自动填入输入框）';
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
      btn.style.cssText = ['display:flex','align-items:center','justify-content:center','width:28px','height:28px','margin-left:2px','padding:0','background:transparent','border:none','border-radius:6px','color:inherit','cursor:pointer','flex:0 0 auto','opacity:.75'].join(';');
    }

    // 每次确保事件绑定（用 onclick 属性，重复赋值不会叠加）
    btn.onclick = function (e) {
      e.preventDefault();
      e.stopPropagation();
      var hide = false;
      try { hide = localStorage.getItem('tokbarHideUI') === '1'; } catch (er) {}
      // 搭 /metrics 轮询的便车：设置标记，下次轮询时触发截图（绕过所有 CSP/fetch 限制）
      shotRequest = { hide: hide };
    };
    btn.onmouseenter = function () { btn.style.opacity = '1'; btn.style.background = 'rgba(255,255,255,.08)'; };
    btn.onmouseleave = function () { btn.style.opacity = '.75'; btn.style.background = 'transparent'; };

    if (btn.parentElement !== host || btn.previousElementSibling !== group) {
      host.insertBefore(btn, group.nextSibling);
    }
    if (!btn.dataset.shotChecked) {
      btn.dataset.shotChecked = '1';
      fetch('http://127.0.0.1:9335/status').then(function (r) { return r.json(); }).then(function (st) {
        if (st && st.shot === false) btn.style.display = 'none';
      }).catch(function () {});
    }
  }

  // 找输入框卡片里最右下方的按钮（即发送圆钮）
  function findSendButton() {
    var comp = findComposer();
    if (!comp) return null;
    var compTop = comp.getBoundingClientRect().top;
    var card = comp;
    for (var i = 0; i < 6 && card; i++) card = card.parentElement;
    if (!card) return null;
    var btns = card.querySelectorAll('button, [role="button"]');
    var best = null, bestX = -Infinity, bestY = -Infinity;
    for (var j = 0; j < btns.length; j++) {
      var r = btns[j].getBoundingClientRect();
      if (r.width < 18 || r.height < 18) continue;   // 过滤图标碎屑
      if (r.top < compTop - 4) continue;             // 只看输入行及以下（工具栏行）
      if (r.left > bestX || (r.left === bestX && r.top > bestY)) {
        bestX = r.left; bestY = r.top; best = btns[j];
      }
    }
    return best;
  }

  // ===== 截屏选项按钮（眼睛斜杠图标）：点击弹出「截屏时隐藏当前界面」开关 =====
  function hideUIEnabled() {
    try { return localStorage.getItem('tokbarHideUI') === '1'; } catch (e) { return false; }
  }

  function renderHidePopup(pop) {
    var on = hideUIEnabled();
    var p = palette();
    var dark = isDark();
    // 保存定位（cssText 会全部重置，需要在渲染后恢复）
    var savedRight = pop.style.right;
    var savedBottom = pop.style.bottom;
    pop.style.cssText = [
      'position:fixed', 'z-index:2147483600', 'display:block',
      'min-width:200px', 'padding:10px 14px',
      'background:' + (dark ? '#2b2b2b' : '#ffffff'),
      'border:1px solid ' + p.line, 'border-radius:10px',
      'box-shadow:0 8px 24px rgba(0,0,0,.35)',
      'font:11px/1.4 "Microsoft YaHei UI","Microsoft YaHei",ui-sans-serif,system-ui,sans-serif',
      'color:' + p.fg, 'cursor:pointer', 'user-select:none'
    ].join(';');
    pop.style.right = savedRight;
    pop.style.top = 'auto';
    pop.style.bottom = savedBottom;
    pop.innerHTML =
      '<span>截屏时隐藏当前界面</span>' +
      '<span style="float:right;display:inline-block;width:28px;height:16px;border-radius:8px;position:relative;background:' +
        (on ? p.good : 'rgba(128,128,128,.45)') + ';transition:background .15s">' +
        '<i style="position:absolute;top:2px;left:' + (on ? '14px' : '2px') +
        ';width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s"></i>' +
      '</span>';
    // 点击开关只切换状态 + 重渲染，不关闭弹窗
    pop.onclick = function (ev) {
      ev.stopPropagation();
      ev.preventDefault();
      try { localStorage.setItem('tokbarHideUI', hideUIEnabled() ? '0' : '1'); } catch (e2) {}
      renderHidePopup(pop);
    };
    // 阻止 mousedown 冒泡（否则外层关闭监听会误关）
    pop.onmousedown = function (ev) { ev.stopPropagation(); };
  }

  function ensureHideButton() {
    var shot = document.getElementById('zcode-tokbar-shot');
    if (!shot || !shot.parentElement) return;
    var btn = document.getElementById('zcode-tokbar-hideui');
    if (btn && btn.dataset.tokbar !== '1') { btn.remove(); btn = null; }
    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'zcode-tokbar-hideui';
      btn.dataset.tokbar = '1';
      btn.type = 'button';
      btn.title = '截屏选项';
      btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
      btn.style.cssText = ['display:flex','align-items:center','justify-content:center','width:18px','height:28px','padding:0','background:transparent','border:none','border-radius:4px','color:inherit','cursor:pointer','flex:0 0 auto','opacity:.75'].join(';');
      btn.onmouseenter = function () { btn.style.opacity = '1'; btn.style.background = 'rgba(255,255,255,.08)'; };
      btn.onmouseleave = function () { btn.style.opacity = '.75'; btn.style.background = 'transparent'; };
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        var pop = document.getElementById('zcode-tokbar-hideui-pop');
        if (!pop) {
          pop = document.createElement('div');
          pop.id = 'zcode-tokbar-hideui-pop';
          document.body.appendChild(pop);
        }
        var isOpen = pop.style.display === 'block';
        if (isOpen) {
          pop.style.display = 'none';
          var svg0 = btn.querySelector('svg');
          if (svg0) svg0.style.transform = '';
          return;
        }
        renderHidePopup(pop);
        var r = btn.getBoundingClientRect();
        pop.style.right = (window.innerWidth - r.right) + 'px';
        pop.style.top = 'auto';
        pop.style.bottom = (window.innerHeight - r.top + 6) + 'px';  // 向上弹出
        var svg1 = btn.querySelector('svg');
        if (svg1) { svg1.style.transform = 'rotate(180deg)'; svg1.style.transition = 'transform .15s'; }
        setTimeout(function () {
          document.addEventListener('mousedown', function close(ev) {
            var pp = document.getElementById('zcode-tokbar-hideui-pop');
            var b = document.getElementById('zcode-tokbar-hideui');
            if (pp && b && !pp.contains(ev.target) && ev.target !== b && !b.contains(ev.target)) {
              pp.style.display = 'none';
              var svg2 = b.querySelector('svg');
              if (svg2) svg2.style.transform = '';
              document.removeEventListener('mousedown', close);
            }
          });
        }, 0);
      };
    }
    if (btn.parentElement !== shot.parentElement || btn.previousElementSibling !== shot) {
      shot.parentElement.insertBefore(btn, shot.nextSibling);
    }
  }

  // ===== 一键 retry：输入框为空且模型没在跑时，按一下就往输入框发一条 "retry" =====
  var lastRetryCheck = 0;
  var lastRunning = false;   // 由 update(m) 维护（/metrics 的 running）
  var sending = false;
  var lastSentAt = 0;

  // 取主输入框的 Lexical 桥。页面上可能有多个带桥的编辑器（主输入框 v4-composer-input、
  // 编辑消息的 v4-edit-input 等），必须按 testid 精确选中主输入框，否则字会写进死编辑器。
  function getBridge() {
    var el = document.querySelector('[data-testid="v4-composer-input"]');
    if (el && el.__zcodeLexicalInputE2E) return el.__zcodeLexicalInputE2E;
    var all = document.querySelectorAll('[data-e2e-lexical-bridge="ready"]');
    for (var i = 0; i < all.length; i++) {
      var r = all[i].getBoundingClientRect();
      if (r.width > 60 && r.height > 10 && all[i].__zcodeLexicalInputE2E) return all[i].__zcodeLexicalInputE2E;
    }
    return null;
  }

  function composerText() {
    var api = getBridge();
    if (api) {
      try { return String(api.getText() || ''); } catch (e) {}
    }
    var comp = findComposer();
    if (!comp) return '';
    return (comp.tagName === 'TEXTAREA' || comp.tagName === 'INPUT') ? String(comp.value || '') : String(comp.innerText || '');
  }

  // ZCode 输入框是 Lexical 编辑器：textarea.value / 纯 DOM 改动不会更新它的内部状态，
  // 发送钮的 canSend 就一直是 false。官方留了 E2E 桥（data-e2e-lexical-bridge="ready"），
  // 桥上的 setText() 走 editor.update()，状态/按钮都会正常联动。
  function fillComposer(text) {
    var api = getBridge();
    if (api) {
      try {
        api.setText(text);
        api.focus();
        return api;
      } catch (e) {}
    }
    var comp = findComposer();
    if (!comp) return null;
    comp.focus();
    if (comp.tagName === 'TEXTAREA' || comp.tagName === 'INPUT') {
      var proto = comp.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
      var desc = Object.getOwnPropertyDescriptor(proto, 'value');
      if (desc && desc.set) desc.set.call(comp, text); else comp.value = text;
      comp.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      try { document.execCommand('selectAll', false, null); document.execCommand('insertText', false, text); } catch (e) {}
    }
    return comp;
  }

  // 发送：桥 setText 是异步提交的（Lexical update → React commit），所以分三段等：
  // 1) 等文字真的出现在编辑器里  2) 等官方发送钮可用  3) 点一次，等编辑器被清空
  // 不做「补回车」兜底 —— 那会在清空稍慢时把同一段文字发两遍。
  function sendText(text) {
    if (sending) return;
    if (Date.now() - lastSentAt < 2500) return;   // 发送冷却，防连点重复
    var comp = fillComposer(text);
    if (!comp) return;
    sending = true;
    var clicked = false, sawText = false;
    var deadline = Date.now() + 2500;
    (function attempt() {
      var now = composerText().trim();
      if (!clicked) {
        if (now === text) sawText = true;
        if (sawText && now !== text) { sending = false; lastSentAt = Date.now(); return; } // 被外部发出/清空
        var btn = document.querySelector('[data-testid="v4-composer-send"]') || findSendButton();
        var usable = btn && !btn.disabled && btn.getAttribute('aria-disabled') !== 'true';
        if (now === text && usable) {
          clicked = true;
          try { btn.click(); } catch (e) {}
          lastSentAt = Date.now();
          setTimeout(function () { sending = false; }, 700);  // 给 ZCode 时间清空编辑器
          return;
        }
      } else if (now !== text) { sending = false; return; }     // 已发出
      if (Date.now() > deadline) { sending = false; return; }   // 一直没就绪：放弃，文字留在框里
      setTimeout(attempt, 120);
    })();
  }

  function composerHasText() {
    return !!composerText().trim();
  }

  // 运行中：ZCode 生成时会换成停止按钮（data-testid="v4-stop"），外加 /metrics 的 running
  function modelRunning() {
    if (lastRunning) return true;
    var stop = document.querySelector('[data-testid="v4-stop"]');
    if (stop) {
      var r = stop.getBoundingClientRect();
      if (r.width > 8 && r.height > 8) return true;
    }
    var btns = document.querySelectorAll('button[aria-label], button[title]');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      var l = String(b.getAttribute('aria-label') || b.getAttribute('title') || '').trim();
      if (l !== '停止生成' && l !== '停止' && l !== 'Stop' && l !== 'Stop generating') continue;
      r = b.getBoundingClientRect();
      if (r.width > 8 && r.height > 8) return true;
    }
    return false;
  }

  var ICON_RETRY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>';

  function ensureRetryButton() {
    var hide = document.getElementById('zcode-tokbar-hideui');
    if (!hide || !hide.parentElement) return;
    var btn = document.getElementById('zcode-tokbar-retry');

    if (!btn) {
      btn = document.createElement('button');
      btn.id = 'zcode-tokbar-retry';
      btn.dataset.tokbar = '1';
      btn.type = 'button';
      btn.style.cssText = ['display:flex','align-items:center','justify-content:center','width:28px','height:28px','padding:0','background:transparent','border:none','border-radius:6px','color:inherit','cursor:pointer','flex:0 0 auto','opacity:.85'].join(';');
      btn.onmouseenter = function () {
        if (btn.dataset.mode !== 'ready') return;
        btn.style.opacity = '1'; btn.style.background = 'rgba(255,255,255,.08)';
      };
      btn.onmouseleave = function () {
        btn.style.background = 'transparent';
        btn.style.opacity = btn.dataset.mode === 'ready' ? '.85' : '.4';
      };
      btn.onclick = function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (composerHasText()) { var c = findComposer(); if (c) c.focus(); return; }  // 有草稿：不覆盖
        if (modelRunning()) return;                                                   // 正在生成：不发
        sendText('retry');
        // 诊断：2.5 秒后抓一次真实状态，搭 /metrics 轮询回报（只带一次）
        setTimeout(function () {
          var bridges = document.querySelectorAll('[data-e2e-lexical-bridge="ready"]');
          var mainEl = document.querySelector('[data-testid="v4-composer-input"]');
          var api = getBridge();
          var sbtn = document.querySelector('[data-testid="v4-composer-send"]');
          var comp = findComposer();
          window.__tokbarDiag = JSON.stringify({
            bridges: bridges.length,
            mainHasBridge: !!(mainEl && mainEl.__zcodeLexicalInputE2E),
            bridgeText: api ? String(api.getText() || '').slice(0, 30) : null,
            composerTag: comp ? comp.tagName + (comp.getAttribute && comp.getAttribute('contenteditable') != null ? '[ce]' : '') : null,
            compText: composerText().slice(0, 30),
            sendBtn: !!sbtn,
            sendDisabled: sbtn ? !!sbtn.disabled : null,
            running: modelRunning(),
          });
        }, 2500);
      };
    }

    // 常驻：输入框为空且模型没在跑 → 可用；否则灰掉
    var hasText = composerHasText();
    var running = modelRunning();
    var ready = !hasText && !running;
    btn.dataset.mode = ready ? 'ready' : 'blocked';
    btn.title = ready ? '发送 retry' : (running ? '模型正在运行，等它结束' : '清空输入框后可用');
    btn.innerHTML = ICON_RETRY;
    btn.style.display = 'flex';
    btn.style.opacity = ready ? '.85' : '.4';
    btn.style.cursor = ready ? 'pointer' : 'default';
    if (btn.previousElementSibling !== hide) hide.parentElement.insertBefore(btn, hide.nextSibling);
  }

  function ensureRetryThrottled() {
    var now = Date.now();
    if (now - lastRetryCheck < 700) return;   // 要遍历 DOM，别跟着 300ms 的 tick 跑
    lastRetryCheck = now;
    ensureRetryButton();
  }

  function ensure() {
    ensureShotButton();
    ensureHideButton();
    ensureRetryThrottled();
    var send = findSendButton();
    if (!send || !send.parentElement) return false;
    var bar = document.getElementById(BAR_ID);
    if (!bar) bar = buildBar();
    // 插到「发送圆钮左边那个元素」（即模型选择器）的左侧
    var anchor = send.previousElementSibling || send;
    if (bar.parentElement !== send.parentElement || bar.nextElementSibling !== anchor) {
      send.parentElement.insertBefore(bar, anchor);
    }
    layoutBar(bar);
    return true;
  }

  function update(m) {
    lastRunning = !!(m && m.running);
    ensure();
    var p = palette();
    var dot = document.getElementById('tokbar-dot');
    var tps = document.getElementById('tokbar-tps');
    var cache = document.getElementById('tokbar-cache');
    var tok = document.getElementById('tokbar-tok');
    if (!dot) return;

    function fmt(n) {
      return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(Math.round(n || 0));
    }

    dot.style.background = (m && m.running) ? p.good : p.dim;
    dot.style.boxShadow = (m && m.running) ? ('0 0 6px ' + p.good) : 'none';

    if (!m || !m.ok) {
      tps.textContent = '—';
      cache.textContent = '—';
      cache.style.color = p.dim;
      tok.textContent = '暂无数据';
      layoutBar(document.getElementById(BAR_ID));
      return;
    }
    tps.textContent = (m.tps || 0).toFixed(1);
    var pct = m.cacheHitRate || 0;
    cache.textContent = pct.toFixed(1) + '%';
    cache.style.color = p.strong;
    tok.innerHTML = '<span style="font-family:' + MONO + '">' + (m.calls || 0) + '</span> 次 · ' +
      '<span style="font-family:' + MONO + '">' + fmt(m.outputTokens) + '</span> out';
    layoutBar(document.getElementById(BAR_ID));
  }

  function ready() {
    if (document.readyState !== 'complete') return false;
    var el = findComposer();
    if (!el) return false;
    var r = el.getBoundingClientRect();
    return r.width >= 60 && r.height >= 8 && r.top >= 0 && r.top <= window.innerHeight;
  }

  function tick() {
    if (!installed) {
      if (!ready()) { readyAt = 0; return; }
      if (!readyAt) { readyAt = Date.now(); return; }
      if (Date.now() - readyAt < 2500) return;
      if (!ensure()) return;
      installed = true;
      setInterval(ensure, 1500);
      new MutationObserver(function () {
        if (!document.getElementById(BAR_ID)) ensure();
      }).observe(document.body, { childList: true, subtree: true });
      return;
    }
    ensure();
  }

  function poll() {
    var url = API;
    if (window.__tokbarDiag) {
      url = API + '?diag=' + encodeURIComponent(window.__tokbarDiag);
      window.__tokbarDiag = null;  // 只带一次
    } else if (shotRequest) {
      url = API + '?shot=1&hide=' + (shotRequest.hide ? '1' : '0');
      shotRequest = null;  // 只带一次
    }
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (m) { if (installed) update(m); })
      .catch(function () {});
  }

  setInterval(function () { try { tick(); } catch (e) {} }, 300);
  setInterval(function () { try { poll(); } catch (e) {} }, 800);
  window.addEventListener('resize', function () {
    try { layoutBar(document.getElementById(BAR_ID)); } catch (e) {}
  });

  } catch (e) {
    /* 渲染层任何异常都静默吞掉 */
  }
})();
</script>
